openapi: 3.1.0
info:
  version: 1.0.0
  title: "INFS605-23204039: OpenAPI Spec"
  description: API Spec for all 3 microservices
  contact:
    name: Kane Viggers
    url: "https://kaneviggers.com"
    email: hello@kaneviggers.com
paths:
  /courses:
    get:
      summary: Get all courses
      description: Returns all courses
      responses:
        "200":
          description: All courses with their enrolled student IDs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Course"
      tags:
        - Courses
    post:
      summary: Create a new course
      responses:
        "201":
          description: Created course
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          description: Course with that course_code already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - course_code
              properties:
                title:
                  type: string
                  description: The name of the course
                course_code:
                  type: string
                  description: Unique identifier code for course
        required: true
      tags:
        - Courses
  "/courses/{course_code}":
    get:
      summary: Get a course
      description: Returns a single-element array containing the matching course
      responses:
        "200":
          description: Array containing the course
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Course"
                minItems: 1
                maxItems: 1
        "404":
          description: Course not found (empty body)
      parameters:
        - $ref: "#/components/parameters/course_code"
      tags:
        - Courses
    patch:
      summary: Update a course
      responses:
        "200":
          description: Updated course (without student_ids)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseSummary"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          description: Course not found (empty body)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - title
              properties:
                title:
                  type: string
                  description: The name of the course
        required: true
      tags:
        - Courses
      parameters:
        - $ref: "#/components/parameters/course_code"
    delete:
      summary: Delete a course
      description: Deleting a course also removes all of its enrolments
      responses:
        "204":
          description: Deleted course
        "404":
          description: Course already deleted or not found
      parameters:
        - $ref: "#/components/parameters/course_code"
      tags:
        - Courses
  "/courses/{course_code}/students/{student_id}":
    get:
      summary: Returns HTTP status code on whether the student is enrolled
      description: Checks with the students service that the student exists, then checks the course and enrolment
      responses:
        "200":
          description: Student enrolled (empty body)
        "400":
          description: Students service rejected the student_id (e.g. not an integer)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            Student not enrolled (empty body), or student/course not found
            (body with `student not found` or `course not found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          $ref: "#/components/responses/StudentsServiceUnavailable"
      parameters:
        - $ref: "#/components/parameters/course_code"
        - $ref: "#/components/parameters/enrolment_student_id"
      tags:
        - Courses
    delete:
      summary: Unenroll a student
      responses:
        "204":
          description: Student has been unenrolled
        "400":
          description: Students service rejected the student_id (e.g. not an integer)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Student or course not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          $ref: "#/components/responses/StudentsServiceUnavailable"
      tags:
        - Courses
      parameters:
        - $ref: "#/components/parameters/course_code"
        - $ref: "#/components/parameters/enrolment_student_id"
  "/courses/{course_code}/students":
    post:
      summary: Enroll a student
      description: Checks with the students service that the student exists before enrolling
      responses:
        "201":
          description: Student enrolled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enrolment"
        "400":
          description: >-
            Request body failed validation, or the students service rejected
            the student_id (e.g. not an integer)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Course or student not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Student already enrolled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          $ref: "#/components/responses/StudentsServiceUnavailable"
      tags:
        - Courses
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - student_id
              properties:
                student_id:
                  type: string
                  description: Unique identifier for a student, sent as a string (e.g. "1")
        required: true
      parameters:
        - $ref: "#/components/parameters/course_code"
  "/feedback/{feedback_id}":
    patch:
      summary: Update a piece of feedback
      responses:
        "200":
          description: Updated feedback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feedback"
        "400":
          description: Request body failed validation, or feedback_id is not an integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Feedback not found (empty body)
      tags:
        - Feedback
      parameters:
        - $ref: "#/components/parameters/feedback_id"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - comment
              properties:
                comment:
                  type: string
                  description: Students feedback on the course
        required: true
    delete:
      summary: Delete a piece of feedback
      responses:
        "204":
          description: Feedback deleted
        "400":
          $ref: "#/components/responses/InvalidId"
        "404":
          description: Feedback already deleted or not found
      tags:
        - Feedback
      parameters:
        - $ref: "#/components/parameters/feedback_id"
    get:
      summary: Get a piece of feedback
      responses:
        "200":
          description: The feedback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feedback"
        "400":
          $ref: "#/components/responses/InvalidId"
        "404":
          description: Feedback not found (empty body)
      tags:
        - Feedback
      parameters:
        - $ref: "#/components/parameters/feedback_id"
  "/feedback/course/{course_code}":
    get:
      summary: Get all feedback for a course
      description: Returns all feedback for a course
      responses:
        "200":
          description: All feedback for the course
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Feedback"
                minItems: 1
        "404":
          description: No feedback found for this course_code (empty body)
      tags:
        - Feedback
      parameters:
        - $ref: "#/components/parameters/course_code"
    post:
      summary: Adds feedback to a course
      description: >-
        Adds feedback to a given course. The student must be enrolled in the
        course (checked with the courses service), and each student can only
        leave one piece of feedback per course.
      responses:
        "201":
          description: Created feedback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feedback"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          description: Course or student not found, or student not enrolled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Student has already given feedback for this course
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Courses service unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      tags:
        - Feedback
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - student_id
                - comment
              properties:
                student_id:
                  type: integer
                  description: Unique identifier for a student, sent as a number (e.g. 1)
                comment:
                  type: string
                  description: Students feedback on the course
        required: true
      parameters:
        - $ref: "#/components/parameters/course_code"
  /students:
    get:
      summary: Get all students
      responses:
        "200":
          description: All students
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Student"
      tags:
        - Students
    post:
      summary: Create a new student
      responses:
        "201":
          description: Created student
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          description: Student with sent email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      tags:
        - Students
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - degree
              properties:
                name:
                  type: string
                  description: Name of the student
                email:
                  type: string
                  description: Email address of the student
                  format: email
                degree:
                  type: string
                  description: Degree the student is enrolled for
        required: true
  "/students/{student_id}":
    delete:
      summary: Delete a student
      responses:
        "204":
          description: Deleted student
        "400":
          $ref: "#/components/responses/InvalidId"
        "404":
          description: Student already deleted or not found
      tags:
        - Students
      parameters:
        - $ref: "#/components/parameters/student_id"
    patch:
      summary: Update student details
      description: Only the fields sent are updated
      responses:
        "200":
          description: Updated student
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
        "400":
          description: Request body failed validation, or student_id is not an integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Student not found (empty body)
        "409":
          description: Student with sent email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      parameters:
        - $ref: "#/components/parameters/student_id"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Name of the student
                email:
                  type: string
                  description: Email address of the student
                  format: email
                degree:
                  type: string
                  description: Degree the student is enrolled for
        required: true
      tags:
        - Students
    get:
      summary: Get a student's details
      responses:
        "200":
          description: The student
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
        "400":
          $ref: "#/components/responses/InvalidId"
        "404":
          description: Student not found (empty body)
      parameters:
        - $ref: "#/components/parameters/student_id"
      tags:
        - Students
components:
  parameters:
    course_code:
      name: course_code
      in: path
      description: Unique identifier code for course
      schema:
        type: string
      required: true
    student_id:
      name: student_id
      in: path
      description: Unique identifier for a student
      schema:
        type: integer
      required: true
    enrolment_student_id:
      name: student_id
      in: path
      description: Unique identifier for a student (validated by the students service)
      schema:
        type: string
      required: true
    feedback_id:
      name: feedback_id
      in: path
      description: Unique identifier for a feedback submission
      schema:
        type: integer
      required: true
  responses:
    ValidationError:
      description: Request body failed validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidId:
      description: Path ID is not an integer (`invalid id`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    StudentsServiceUnavailable:
      description: Students service unreachable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Course:
      type: object
      required:
        - title
        - course_code
        - student_ids
      properties:
        title:
          type: string
          description: The name of the course
        course_code:
          type: string
          description: Unique identifier for course
        student_ids:
          type: array
          description: Array of enrolled student IDs
          items:
            type: string
          uniqueItems: true
    CourseSummary:
      type: object
      required:
        - title
        - course_code
      properties:
        title:
          type: string
          description: The name of the course
        course_code:
          type: string
          description: Unique identifier for course
    Enrolment:
      type: object
      required:
        - course_code
        - student_id
      properties:
        course_code:
          type: string
          description: Unique identifier for course
        student_id:
          type: string
          description: Unique identifier for a student
    Feedback:
      type: object
      required:
        - feedback_id
        - course_code
        - student_id
        - comment
      properties:
        feedback_id:
          type: integer
          description: Unique identifier for a feedback submission
          readOnly: true
        course_code:
          type: string
          description: Unique identifier for course
        student_id:
          type: integer
          description: Unique identifier for a student
        comment:
          type: string
          description: Students feedback on the course
    Student:
      type: object
      required:
        - student_id
        - name
        - email
        - degree
      properties:
        student_id:
          type: integer
          description: Unique identifier for a student
          readOnly: true
        name:
          type: string
          description: Name of the student
        email:
          type: string
          description: Email address of the student
          format: email
        degree:
          type: string
          description: Degree the student is enrolled for
    Error:
      type: object
      required:
        - error
      properties:
        error:
          description: >-
            A message string, or for request body validation failures, the
            array of Zod issues
          oneOf:
            - type: string
            - type: array
              items:
                type: object
                properties:
                  code:
                    type: string
                  path:
                    type: array
                    items:
                      type: string
                  message:
                    type: string
