events {}

http {
  # Make a log for every request
  log_format gateway '$remote_addr "$request" $status $request_time rid=$request_id';
  access_log /dev/stdout gateway;

  server {
    listen 80;

    # Headers forwarded to every service
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Request-ID $request_id;

    location /api/courses {
      proxy_pass http://course-catalogue:3000/courses;
    }

    # location /api/feedback {
    #   proxy_pass http://feedback:3000/feedback;
    # }

    # location /api/notifications {
    #   proxy_pass http://notification:3000/notifications;
    # }

    location = /health {
      default_type application/json;
      return 200 '{"status":"ok"}';
    }

    # Anything else gets a JSON 404 instead of nginx's HTML page
    location / {
      default_type application/json;
      return 404 '{"error":"Route not found"}';
    }
  }
}