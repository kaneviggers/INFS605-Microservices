services:

  postgres:
    image: postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - COURSE_DB_PASSWORD=${COURSE_DB_PASSWORD}
      - STUDENT_DB_PASSWORD=${STUDENT_DB_PASSWORD}
      - FEEDBACK_DB_PASSWORD=${FEEDBACK_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10
  
  students-service:
    build: ./students-service
    environment:
      PORT: 3000
      DATABASE_URL: "postgres://student_user:${STUDENT_DB_PASSWORD}@postgres:5432/student_db"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
  
  courses-service:
    build: ./courses-service
    environment:
      PORT: 3000
      DATABASE_URL: "postgres://course_user:${COURSE_DB_PASSWORD}@postgres:5432/course_db"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
  
  gateway:
    image: nginx:alpine
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      courses-service:
        condition: service_healthy
      students-service:
        condition: service_healthy

volumes:
  pgdata: